[project]
name = "qlora-multihop-rag"
version = "1.0.0"
description = "Multi-hop RAG service with pluggable LLM backends, QLoRA fine-tuning and a HotpotQA benchmark harness"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501", "B008"]
